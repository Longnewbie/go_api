# giới hạn bộ nhớ tối đa trên RAM
maxmemory 256mb

# lru: Least recently used (khi bộ nhớ đạt tới 256MB, redis sẽ xoá key nào có TTL gần hết hạn và ít sử dụng nhất (Time to live))
maxmemory-policy volatile-lru

# bật persistence (RDB) để lưu dữ liệu
# Lưu sau 900s nếu chỉ có 1 thay đổi
save 900 1
# Lưu sau 300s nếu chỉ có 10 thay đổi
save 300 10
# Lưu sau 60s nếu chỉ có 10000 thay đổi
save 60 10000

dir /data