services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: master-golang
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456vV@
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata: